<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="ductline-mark.png">
<script src="firebase-config.js"></script>
<script src="fb-shim.js"></script>
<title>Ductline Factory OS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky shop-floor header + tab bar, KPI strip, one working view at a time; modals for forms */
/* Ductline brand: monochrome (logo is ink line-work on white), light theme only.
   Ink is the brand colour for primary actions; amber is kept strictly for "needs attention". */
:root{
  --bg:#f3f4f5; --panel:#ffffff; --sunk:#eceef0; --line:#d6d9dd; --fg:#16191d; --muted:#5f666e;
  --steel:#16191d; --steel-ink:#ffffff; --hazard:#f2b632; --hazard-ink:#1d1606;
  --tag:#c62f12; --ok:#1f7a4d; --ok-bg:#dcefe4; --warn:#9a5b00; --warn-bg:#fbecc9; --bad:#b3261e; --bad-bg:#f8dcd9; --info-bg:#e6e8eb;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1500px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:16px;padding-block:12px 8px;flex-wrap:wrap}
.brand .logo{height:84px;width:auto;display:block;flex:none}
.brand .rule{width:1px;align-self:stretch;background:var(--line);margin-block:6px}
.brand h1{font-family:var(--body);font-weight:600;font-size:15px;letter-spacing:.42em;text-transform:uppercase;margin:0;line-height:1.2;color:var(--fg)}
.brand h1 small{display:block;font-weight:500;font-size:11px;letter-spacing:.18em;color:var(--muted);margin-top:4px}
footer .co{display:flex;gap:10px;align-items:center;width:100%;border-top:1px solid var(--line);padding-top:14px;margin-top:4px}
footer .co img{height:26px;width:auto}
@media (max-width:640px){.brand .logo{height:62px}.brand h1{font-size:13px;letter-spacing:.3em}.brand h1 small{display:none}}
.brand .sp{flex:1}
.who{font-size:13px;color:var(--muted)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{font-family:var(--display);font-size:17px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;background:none;border:0;color:var(--muted);padding:8px 14px 10px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--fg)}
nav.tabs button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
main{padding-block:18px 60px;display:grid;gap:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;display:grid;gap:2px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.kpi b{font-family:var(--display);font-size:30px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.kpi small{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kpi.alert{border-left:4px solid var(--bad)} .kpi.warnk{border-left:4px solid var(--hazard)}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar h2{font-family:var(--display);font-size:22px;font-weight:600;margin:0;letter-spacing:.02em;text-wrap:balance}
.bar .sp{flex:1}
.muted{color:var(--muted)} .mono{font-family:var(--mono);font-size:.92em}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
button.btn,a.btn{font:600 14px var(--body);border-radius:var(--r);padding:8px 14px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer;white-space:nowrap}
button.btn.pri{background:var(--steel);color:var(--steel-ink);border-color:var(--steel)}
button.btn.haz{background:var(--hazard);color:var(--hazard-ink);border-color:var(--hazard)}
button.btn.danger{color:var(--bad);border-color:var(--bad)}
button.btn.sm{padding:4px 10px;font-size:13px}
button.btn:disabled{opacity:.45;cursor:not-allowed}
button.link{background:none;border:0;color:var(--steel);cursor:pointer;font:inherit;padding:0;text-decoration:underline;text-underline-offset:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.tscroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font:600 12px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
.chip{display:inline-flex;align-items:center;gap:5px;font:600 12px var(--body);letter-spacing:.03em;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.info{background:var(--info-bg);color:var(--steel)}
.chip.sample{background:var(--hazard);color:var(--hazard-ink)}
/* floor board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:10px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--sunk);border-radius:var(--r);padding:8px;display:grid;gap:8px;align-content:start;min-height:160px}
.colh{display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px 4px}
.colh h3{font-family:var(--display);font-size:16px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin:0}
.colh span{font-family:var(--mono);font-size:12px;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 10px 8px 12px;display:grid;gap:6px;cursor:pointer;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:transparent}
.card.urgent::before{background:var(--hazard)} .card.late::before{background:var(--bad)}
.card .r1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card .wo{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.card .cl{font-weight:600;line-height:1.25}
.card .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.card .mv{display:flex;gap:6px;justify-content:flex-end}
.empty{padding:40px 20px;text-align:center;display:grid;gap:12px;justify-items:center}
.empty h3{font-family:var(--display);font-size:24px;font-weight:600;margin:0}
.empty p{max-width:60ch;margin:0;color:var(--muted)}
/* forms + modal */
.ov{position:fixed;inset:0;background:rgb(10 16 22 / .55);z-index:40;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}
.modal{background:var(--panel);border-radius:10px;width:min(980px,100%);border:1px solid var(--line);display:grid}
.modal.narrow{width:min(520px,100%)}
.mh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.mh h2{font-family:var(--display);font-size:22px;font-weight:600;margin:0;flex:1;min-width:0}
.mb{padding:16px 18px;display:grid;gap:16px;min-width:0}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.x{background:none;border:0;font-size:24px;line-height:1;color:var(--muted);cursor:pointer;padding:4px 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
label.f{display:grid;gap:4px;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
input,select,textarea{font:400 15px var(--body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:7px 9px;width:100%;min-width:0;text-transform:none;letter-spacing:0}
input[type=checkbox]{width:auto}
.items td{padding:5px 6px} .items input,.items select{padding:5px 6px;font-size:14px}
.items input.n{width:84px;text-align:right;font-variant-numeric:tabular-nums}
.sec{font-family:var(--display);font-size:15px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.totals{display:flex;gap:18px;flex-wrap:wrap;font-size:14px}
.totals b{font-family:var(--display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;margin-right:4px;color:var(--fg)}
.stages{display:flex;flex-wrap:wrap;gap:4px}
.stg{font:600 12px var(--body);padding:4px 9px;border-radius:4px;background:var(--sunk);color:var(--muted)}
.stg.done{background:var(--info-bg);color:var(--steel)} .stg.cur{background:var(--hazard);color:var(--hazard-ink)} .stg.skip{text-decoration:line-through;opacity:.6}
.note{font-size:13px;color:var(--muted)}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:var(--r);padding:10px 14px;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:var(--r);z-index:60;font-weight:500;max-width:calc(100% - 32px)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.seg button{font:600 13px var(--body);border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:6px 12px;cursor:pointer}
.seg{display:inline-flex} .seg button:first-child{border-radius:var(--r) 0 0 var(--r)} .seg button:last-child{border-radius:0 var(--r) var(--r) 0} .seg button+button{border-left:0}
.seg button[aria-pressed="true"]{background:var(--steel);color:var(--steel-ink);border-color:var(--steel)}
footer{padding-block:20px 40px;color:var(--muted);font-size:13px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
@media (max-width:640px){.kpi b{font-size:24px} .brand h1{font-size:21px} .hide-sm{display:none}}
.drop{display:grid;justify-items:center;gap:8px;text-align:center;padding:40px 20px;border:2px dashed var(--line);cursor:pointer}
.drop.over,.drop:hover{border-color:var(--steel);background:var(--info-bg)}
.drop b{font-family:var(--display);font-size:22px;font-weight:600}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:12px}
@media (max-width:900px){.dgrid{grid-template-columns:minmax(0,1fr)}}
.viewer{position:relative;overflow:hidden;min-height:420px;display:grid}
.viewer canvas{width:100%;height:clamp(380px,62vh,720px);display:block;touch-action:none;cursor:grab;border-radius:var(--r)}
.viewer canvas:active{cursor:grabbing}
.vbtns{position:absolute;top:10px;right:10px;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.legend{position:absolute;left:10px;bottom:10px;display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);background:var(--panel);padding:4px 8px;border-radius:4px;border:1px solid var(--line)}
.legend i{display:inline-block;width:14px;height:3px;margin-right:5px;vertical-align:middle}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--steel);animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
details summary{list-style-position:inside}
tfoot td{border-top:2px solid var(--line);font-size:13px}
.colsub{font-size:12px;color:var(--muted);padding:0 4px 2px;margin-top:-4px;font-variant-numeric:tabular-nums}
.plan{display:flex;flex-wrap:wrap;gap:8px 22px;align-items:center;padding:10px 14px;font-size:14px;color:var(--muted)}
.plan b{font-family:var(--display);font-size:20px;font-weight:600;color:var(--fg);margin-right:3px;font-variant-numeric:tabular-nums}
.plan .sp{flex:1} .plan b.badtxt{color:var(--bad)}
.board .card{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.board .card.armed{box-shadow:0 0 0 2px var(--fg)}
.card.lifting{display:none}
.card.ghost{position:fixed;left:0;top:0;z-index:70;pointer-events:none;box-shadow:0 14px 34px rgb(10 16 22 / .28);border-color:var(--fg);opacity:.96}
.ph{border:2px dashed var(--fg);border-radius:var(--r);background:var(--panel);opacity:.55}
.col.over{background:#e2e5e8;outline:2px solid var(--fg);outline-offset:-2px}
.dropend{min-height:28px}
body.dragging{cursor:grabbing}
body.dragging *{cursor:grabbing!important}
.board.big{grid-auto-columns:minmax(260px,1fr)}
.board.big .card .cl{font-size:17px}
.board.big .colh h3{font-size:18px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <img class="logo" src="ductline-logo.png" alt="Ductline Manufacturing">
      <span class="rule" aria-hidden="true"></span>
      <h1>Factory OS<small>Production · Stock · Dispatch</small></h1>
      <div class="sp"></div>
      <div class="who" id="who"></div>
    </div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </div>
</header>
<div class="wrap"><main id="main"><div class="empty"><h3>Connecting to the factory database…</h3><p>Work orders, stock and purchase orders load here.</p></div></main>
<footer id="foot"></footer></div>
<div id="modal"></div>

<script>
/* Ductline auto-tagger core: drawing entities -> duct runs -> fabrication pieces -> tags. Pure JS, no DOM. */
(function (root) {
  "use strict";
  const DEF = {
    inchToMm: 25,          // shop convention: 22" -> 550 mm
    module: 1200,          // sheet module along the duct (mm, flange to flange)
    flangeAllow: 46,       // TDF: 23 mm per end comes off the fabrication length
    smallBelow: 600,       // pieces shorter than this are "Small Duct"
    mergeBelow: 600,       // a remainder shorter than this is added to the last full piece (Arvind: up to ~1690)
    elbowThroat: 150,      // inner radius used for elbows (mm) -> "Final Length" on elbows
    elbowExt: 50,          // straight extensions each side of an elbow
    sectionRadius: 7000,   // labels this close to a "SECTION X-X" title are section views, not plan
    minPiece: 100,         // remainders shorter than this are dropped into the previous joint
    remainder: "end",      // end | start | split
    deadEnd: true,         // closing sheet at the last run's open end
    lenTol: 12,            // pieces within this many mm are treated as the same piece
    closingLen: 9,
    collarAllow: 5,        // 10"x6" collar -> 255 x 155
    shoeExtra: 75,         // shoe mouth = branch/collar nominal width + this
    shoeLen: 150,
    insulation: [          // zones from the unit end; last zone takes the rest. Empty = bare duct
      { name: "10MM ACCOUSTIC", code: "INS-ACO-10", upto: 1524 },
      { name: "9MM THERMAL", code: "INS-NBR-9" }
    ],
    gaugeBands: [[750, 24], [1500, 22], [2100, 20], [1e9, 18]]
  };

  /* ---------- text ---------- */
  function cleanText(t) {
    return String(t || "")
      .replace(/\\[Pp]/g, " ")
      .replace(/\\[A-Za-z][^;\\{}]*;/g, "")
      .replace(/\\[~]/g, " ")
      .replace(/[{}]/g, "")
      .replace(/%%[cCdDpP]/g, "")
      .replace(/\s+/g, " ").trim();
  }
  function parseLabel(raw) {
    const t = cleanText(raw);
    const up = t.toUpperCase();
    if (/(\d[\d.]*)\s*(?:"|MM)?\s*\(?[WHD]?\)?\s*[X×*]\s*(\d[\d.]*)\s*(?:"|MM)?\s*\(?[WHD]?\)?\s*[X×*]\s*\d/.test(up)) return null; // 3 dims = equipment
    let m = up.match(/(\d+(?:\.\d+)?)\s*(?:"|''|IN|MM)?\s*\(\s*([WH])\s*\)\s*[X×*]\s*(\d+(?:\.\d+)?)\s*(?:"|''|IN|MM)?\s*\(\s*([WH])\s*\)/);
    let a, b;
    if (m) { a = +m[1]; b = +m[3]; if (m[2] === "H") { const s = a; a = b; b = s; } }
    else {
      m = up.match(/(?:^|[^\d.])(\d{1,4}(?:\.\d+)?)\s*(?:"|''|MM)?\s*[X×*]\s*(\d{1,4}(?:\.\d+)?)\s*(?:"|''|MM)?(?![\d.])/);
      if (!m) return null; a = +m[1]; b = +m[2];
    }
    if (!(a > 0 && b > 0)) return null;
    const collar = /COLLAR|SPIGOT|NECK/.test(up);
    const door = /DOOR|GRILL(?!E? *DUCT)|DIFFUSER|LOUVER|LOUVRE|WINDOW|OPENING/.test(up) && !collar && !/DUCT/.test(up);
    const inch = /"|''|\bIN\b|INCH/.test(up) || (a <= 120 && b <= 120);
    const nos = up.match(/(\d+)\s*NOS?\b/);
    const cfm = up.match(/(\d+)\s*CFM/);
    return { text: t, w: a, h: b, inch, collar, door, nos: nos ? +nos[1] : null, cfm: cfm ? +cfm[1] : null };
  }

  /* ---------- geometry ---------- */
  const sub = (a, b) => ({ x: a.x - b.x, y: a.y - b.y });
  const add = (a, b) => ({ x: a.x + b.x, y: a.y + b.y });
  const mul = (a, k) => ({ x: a.x * k, y: a.y * k });
  const dot = (a, b) => a.x * b.x + a.y * b.y;
  const len = a => Math.hypot(a.x, a.y);
  const norm = a => { const l = len(a) || 1; return { x: a.x / l, y: a.y / l }; };
  const perp = a => ({ x: -a.y, y: a.x });
  const dist = (a, b) => len(sub(a, b));

  function isClosed(e) {
    const v = e.vertices || [];
    return !!((e.flag & 1) || (e.flag & 512) || (v.length > 2 && dist(v[0], v[v.length - 1]) < 1e-6));
  }
  function segmentsOf(ents) {
    const segs = [];
    ents.forEach((e, idx) => {
      if (e.type === "LINE") { segs.push({ a: e.startPoint, b: e.endPoint, layer: e.layer, src: idx }); }
      else if (e.type === "LWPOLYLINE" && e.vertices && e.vertices.length > 1) {
        const v = e.vertices; const n = v.length; const closed = isClosed(e);
        for (let i = 0; i < n - 1 + (closed ? 1 : 0); i++) {
          const p = v[i], q = v[(i + 1) % n];
          if (p.bulge && Math.abs(p.bulge) > 1e-3) continue;
          segs.push({ a: p, b: q, layer: e.layer, src: idx });
        }
      }
    });
    return segs.filter(s => dist(s.a, s.b) > 1e-6).map(s => { const d = sub(s.b, s.a); s.len = len(d); s.dir = norm(d); return s; });
  }
  function textPos(e) { return e.insertionPoint || e.startPoint || e.position || { x: 0, y: 0 }; }

  /* Find the two parallel walls of a duct of width wU near point c */
  function findRun(segs, c, wU, used) {
    const R = Math.max(14 * wU, 60);
    const near = segs.filter(s => {
      if (s.len < 0.8 * wU) return false;
      const t = Math.max(0, Math.min(1, dot(sub(c, s.a), s.dir) / s.len));
      return dist(c, add(s.a, mul(s.dir, t * s.len))) < R;
    });
    let best = null;
    for (let i = 0; i < near.length; i++) for (let j = i + 1; j < near.length; j++) {
      const s1 = near[i], s2 = near[j];
      if (used.has(s1) || used.has(s2)) continue;
      const cr = Math.abs(s1.dir.x * s2.dir.y - s1.dir.y * s2.dir.x);
      if (cr > 0.035) continue;
      const nrm = perp(s1.dir);
      const d = Math.abs(dot(sub(s2.a, s1.a), nrm));
      if (d < 0.9 * wU || d > 1.1 * wU) continue;
      const t2a = dot(sub(s2.a, s1.a), s1.dir), t2b = dot(sub(s2.b, s1.a), s1.dir);
      const lo = Math.max(0, Math.min(t2a, t2b)), hi = Math.min(s1.len, Math.max(t2a, t2b));
      const ov = hi - lo; if (ov < 1.2 * wU) continue;
      const side = dot(sub(s2.a, s1.a), nrm) > 0 ? 1 : -1;
      const p0 = add(add(s1.a, mul(s1.dir, lo)), mul(nrm, side * d / 2));
      const p1 = add(add(s1.a, mul(s1.dir, hi)), mul(nrm, side * d / 2));
      const mid = mul(add(p0, p1), .5);
      // distance from the label to the duct body (not just its midpoint)
      const tc = Math.max(lo, Math.min(hi, dot(sub(c, s1.a), s1.dir)));

      // walls of one duct start and end together; a long line shared with a neighbouring duct does not

      const score = Math.min(ov, 8 * wU) - 2 * dl + (s1.layer === s2.layer ? 2 * wU : -2 * wU) + lay(s1.layer) + lay(s2.layer) - 8 * Math.abs(d - wU) - 0.5 * spill;

  }

  function gaugeFor(mx, bands) { for (const [lim, g] of bands) if (mx <= lim) return g; return 18; }

  /* ---------- main (v2: duct networks) ---------- */
  const BAD_LAYER = /PIPE|CHW|CDW|DRAIN|TRAP|SLAB|FLOOR|SECT|CEIL|COLUMN|S-COL|GRID|FURN|WALL|DIM|ANNO|TTLB|HATCH|VALVE|DAMPER|BEAM|STAIR|DOOR|WINDOW|LIGHT|ELEC|PLUMB|SPRINK|TEXT|REFRIG|COPPER|CUTOUT|ZONING|COMMENT|^DEFPOINTS$/i;

  function analyze(ents, header, userOpts) {
    const o = Object.assign({}, DEF, userOpts || {});
    const warnings = [];
    const ins = header && (header.INSUNITS ?? header.$INSUNITS);
    const unitMm = ({ 1: 25.4, 2: 304.8, 4: 1, 5: 10, 6: 1000 })[ins];

    /* labels */
    const labels = [], sections = [];
    ents.forEach((e, i) => {
      if (e.type !== "TEXT" && e.type !== "MTEXT") return;

      if (/\bSECTION\s*[:\-]?\s*[A-Z]\s*-\s*[A-Z]\b/i.test(raw)) sections.push(textPos(e));

    });
    const inchDrawing = unitMm === 25.4 || (!unitMm && labels.filter(l => !l.collar).every(l => l.inch));
    const fabPerUnit = inchDrawing ? o.inchToMm : (unitMm || 1);
    const mmToU = v => v / fabPerUnit;
    const secR = mmToU(o.sectionRadius || 7000);
    const inSection = p => sections.some(s => dist(s, p) < secR);

    const collarLabels = labels.filter(l => l.collar);
    if (sections.length) warnings.push(`${sections.length} section view${sections.length > 1 ? "s" : ""} on the sheet were left out of the take-off.`);
    if (!ductLabels.length) warnings.push("No duct size labels found (looked for text like 22(W)X12(H) or 550x300).");
    const labelToUnits = l => l.inch ? (inchDrawing ? 1 : 25.4 / (unitMm || 1)) : (inchDrawing ? 1 / 25.4 : 1 / (unitMm || 1));
    const labelToMm = (l, v) => l.inch ? Math.round(v * o.inchToMm) : Math.round(v);

    const allSegs = segmentsOf(ents);
    const segs = allSegs.filter(s => layerOk(s.layer));
    const used = new Set();

    /* grow a run along its walls through breaks (branch openings, split lines) */
    function wallCover(seed, axisA, dir, tol, gap) {
      const n = perp(dir);
      const off = dot(sub(seed.a, axisA), n);
      const iv = [];
      segs.forEach(s => {
        if (Math.abs(s.dir.x * dir.y - s.dir.y * dir.x) > 0.03) return;
        const oa = dot(sub(s.a, axisA), n), ob = dot(sub(s.b, axisA), n);
        if (Math.abs(oa - off) > tol || Math.abs(ob - off) > tol) return;
        const ta = dot(sub(s.a, axisA), dir), tb = dot(sub(s.b, axisA), dir);

      });
      iv.sort((a, b) => a[0] - b[0]);

    }
    function grow(r) {
      const dir = norm(sub(r.p1, r.p0)), n = perp(dir), A = r.p0;
      const tol = Math.max(0.5, 0.05 * r.wU), gap = 2.6 * r.wU;
      const w1 = wallCover(r.edges[0], A, dir, tol, gap), w2 = wallCover(r.edges[1], A, dir, tol, gap);
      const L0 = 0, L1 = dist(r.p0, r.p1);

      if (!a || !b) return;

    }
    function mkRun(pair, W, H, cfm, label, inherited) {

    }

    /* 1. seed runs from labels */
    let runs = [];
    ductLabels.forEach(l => {
      const wU = l.w * labelToUnits(l);
      const r = findRun(segs, l.pos, wU, used);
      if (!r) { warnings.push(`No duct walls found next to label "${l.text}".`); return; }
      runs.push(mkRun(r, labelToMm(l, l.w), labelToMm(l, l.h), l.cfm, l));
    });

    /* 2. follow each run past fittings: unlabeled wall pairs of the same width, or of another labelled width (taper) */
    const widths = [...new Map(ductLabels.map(l => [l.w * labelToUnits(l), l])).entries()];
    function pairsNear(E, wU, maxD) {

      const out = [];
      for (let i = 0; i < cand.length; i++) for (let j = i + 1; j < cand.length; j++) {

            const side = dot(sub(s2.a, s1.a), nrm) > 0 ? 1 : -1;
            const p0 = add(add(s1.a, mul(s1.dir, lo)), mul(nrm, side * d / 2)), p1 = add(add(s1.a, mul(s1.dir, hi)), mul(nrm, side * d / 2));

    }

    /* 3b. a smaller duct drawn straight through a bigger one is two branches, one each side */
    for (let pass = 0; pass < 3; pass++) {
      const add2 = [];
      runs.forEach(r => {

      if (entStart < 0 && L[i].trim() === "2" && L[i + 1].trim() === "ENTITIES" && L[i - 1] && L[i - 1].trim() === "SECTION") entStart = i;
      if (entStart >= 0 && L[i].trim() === "0" && L[i + 1].trim() === "ENDSEC" && i > entStart) { entEnd = i; break; }
    }
    if (entEnd < 0) throw new Error("This DXF has no ENTITIES section.");
    let layerLines = [];
    if (layer0) {
      const b = layer0.block.slice();

        if (c === "5") b[k + 1] = H();

    }
    const res = L.slice(0, entEnd).concat(out, L.slice(entEnd));
    if (layer0) res.splice(layer0.end, 0, ...layerLines);
    if (seedIdx > 0) res[seedIdx] = next.toString(16).toUpperCase();
    return res.join(nl);
  }

    items.forEach(it => {
      if (it.type === "LINE") { P(0, "LINE"); P(8, layerName); P(10, fx(it.a.x)); P(20, fx(it.a.y)); P(30, "0.0"); P(11, fx(it.b.x)); P(21, fx(it.b.y)); P(31, "0.0"); }
      else { P(0, "TEXT"); P(8, layerName); P(10, fx(it.x)); P(20, fx(it.y)); P(30, "0.0"); P(40, fx(it.h)); P(1, it.text); if (it.rot) P(50, fx(it.rot)); P(72, 1); P(11, fx(it.x)); P(21, fx(it.y)); P(31, "0.0"); P(73, 2); }
    });
    P(0, "ENDSEC"); P(0, "EOF");
    return o.join("\r\n");
  }

  function tagsOnlyDxf(items, insunits, layerName, color) {
    const o = []; const P = (c, v) => o.push(String(c), String(v)); const fx = n => (+n).toFixed(6);
    P(0, "SECTION"); P(2, "HEADER"); P(9, "$ACADVER"); P(1, "AC1009"); P(9, "$INSUNITS"); P(70, insunits || 0); P(0, "ENDSEC");

      else { P(0, "TEXT"); P(8, layerName); P(10, fx(it.x)); P(20, fx(it.y)); P(30, "0.0"); P(40, fx(it.h)); P(1, it.text); if (it.rot) P(50, fx(it.rot)); P(72, 1); P(11, fx(it.x)); P(21, fx(it.y)); P(31, "0.0"); P(73, 2); }

<script>
/* ===== Shop norms (edit here to change planning rules) ===== */
const STAGES=[["planned","Planned"],["cutting","Cutting"],["folding","Folding & seaming"],["assembly","Flanging & assembly"],["insulation","Insulation"],["qc","QC"],["ready","Ready to dispatch"],["dispatched","Dispatched"]];
const STAGE_N=Object.fromEntries(STAGES);
const GAUGES={24:{mm:0.60,kg:4.83},22:{mm:0.80,kg:6.40},20:{mm:1.00,kg:7.97},18:{mm:1.20,kg:9.54}}; // GP coil Z120 as bought from Harsh Industries: 7.85 kg/m² per mm + 0.12 kg/m² zinc
const autoGauge=(w,h)=>{const m=Math.max(+w||0,+h||0);return m<=750?24:m<=1500?22:m<=2100?20:18}; // shop bands, largest side (mm)
const FITTINGS={straight:["Straight duct",1.0],small:["Small duct",1.0],elbow:["Elbow",1.0],bend:["Bend / elbow",1.5],reducer:["Reducer",1.2],taper:["Taper",1.0],offset:["Offset / shoe",1.3],shoe:["Shoe piece",1.0],plenum:["Plenum / box",1.1],closing:["Closing sheet",1.0]};
const NORMS={sheetWaste:0.10,insulWaste:0.05,sealantLperM2:0.04,cornersPerPiece:8,flangeEndsPerPiece:2};
const CATALOG=[
 ["GI-24","GI sheet 24G (0.63 mm)","GI sheet","kg",1500,2000],["GI-22","GI sheet 22G (0.80 mm)","GI sheet","kg",1500,2000],
 ["GI-20","GI sheet 20G (1.00 mm)","GI sheet","kg",800,1000],["GI-18","GI sheet 18G (1.25 mm)","GI sheet","kg",400,500],
 ["TDC-FLG","TDC flange profile","Joining","m",300,500],["TDC-CNR","TDC corner piece","Joining","nos",400,1000],
 ["GSK-TAPE","Gasket tape 12 mm","Joining","m",300,500],["SEAL","Duct sealant","Consumables","ltr",20,40],
 ["INS-NBR","Nitrile insulation 19 mm","Insulation","m²",150,300],["INS-NBR-9","Nitrile insulation 9 mm (thermal)","Insulation","m²",150,300],
 ["INS-ACO-10","Acoustic insulation 10 mm","Insulation","m²",50,100],
 ["GI-24-FO","Spiral / flat-oval coil 24G","GI sheet","kg",1000,2000],["GI-22-FO","Spiral / flat-oval coil 22G","GI sheet","kg",500,1000],
 ["GI-20-FO","Spiral / flat-oval coil 20G","GI sheet","kg",200,500],["INS-NBR-13","Thermal insulation 13 mm","Insulation","m²",100,200]];

/* ===== Dispatch → stock rules =====
   Every goods invoice raised in Zoho (with or without an e-way bill) is a dispatch.
   Each line is turned into material used, from its item name, gauge and m².
   Accessory ratios per m² of TDF duct are the averages of the October work orders. */
const DISPATCH={
  tdf:{flgM:2.08,cnr:4.59,gskM:1.04,sealL:0.04},   // per m² of TDF rectangular duct
  insWaste:NORMS.insulWaste
};
function mapLine(l){
  const n=String(l.name||""),u=String(l.unit||"").toLowerCase(),q=+l.qty||0,d=String(l.desc||"");
  const out=[],add=(code,qty,why)=>{if(qty>0)out.push({code,qty,why})};
  if(!q)return {out,skip:"zero qty"};
  if(/\bSS\b|stainless/i.test(n))return {out,skip:"stainless (not tracked)"};
  const gm=n.match(/\b(18|20|22|24|26)\s*G\b/i);const g=gm?+gm[1]:null;
  const isSqm=/sq|m2|m²/.test(u);
  if(/insul/i.test(n)&&isSqm){
    const t=(n.match(/(\d+)\s*mm/i)||[])[1];const ac=/acou|accou/i.test(n);
    const code=ac?(t==="10"?"INS-ACO-10":null):t==="9"?"INS-NBR-9":t==="13"?"INS-NBR-13":t==="19"?"INS-NBR":null;
    if(/work/i.test(n))return {out,skip:"insulation labour only"};
    if(!code)return {out,skip:"insulation size not tracked"};
    add(code,q*(1+DISPATCH.insWaste),`${q} m² + ${DISPATCH.insWaste*100}%`);return {out};
  }
  if(/^\s*(tdf\s*)?corners?\b/i.test(n)){add("TDC-CNR",q,"sold loose");return {out}}
  if(g&&isSqm){
    if(!GAUGES[g])return {out,skip:g+"G not tracked"};
    const fo=/oval|spiral/i.test(n);
    const kg=q*GAUGES[g].kg*(1+NORMS.sheetWaste);
    add(fo?`GI-${g}-FO`:`GI-${g}`,kg,`${q} m² × ${GAUGES[g].kg} kg/m² + ${NORMS.sheetWaste*100}%`);
    const tdf=!fo&&!/angle|round|vcd|damper|sheet/i.test(n);
    if(tdf){
      const cm=d.match(/corners?\s*[-:=]\s*(\d+)/i);
      add("TDC-FLG",q*DISPATCH.tdf.flgM,`${DISPATCH.tdf.flgM} m/m²`);
      add("TDC-CNR",cm?+cm[1]:q*DISPATCH.tdf.cnr,cm?"as on invoice":`${DISPATCH.tdf.cnr}/m²`);
      add("GSK-TAPE",q*DISPATCH.tdf.gskM,`${DISPATCH.tdf.gskM} m/m²`);
      add("SEAL",q*DISPATCH.tdf.sealL,`${DISPATCH.tdf.sealL} L/m²`);
    }
    return {out};
  }
  return {out,skip:"not a tracked material"};
}
function dispatchUse(dp){
  const tot={},lines=(dp.lines||[]).map(l=>{const r=mapLine(l);for(const o of r.out)tot[o.code]=(tot[o.code]||0)+o.qty;return {...l,...r}});
  return {lines,tot};
}

/* ===== helpers ===== */
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=(n,d=0)=>(Math.round((+n||0)*10**d)/10**d).toLocaleString("en-IN",{minimumFractionDigits:d,maximumFractionDigits:d});
const inr=n=>"₹"+fmt(n,0);
const today=()=>new Date().toISOString().slice(0,10);
const dfmt=s=>s?new Date(s+(s.length===10?"T00:00":"")).toLocaleDateString("en-IN",{day:"2-digit",month:"short"}):"—";
const dtfmt=s=>s?new Date(s).toLocaleString("en-IN",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit",timeZone:"Asia/Kolkata"}):""; // factory clock
const daysTo=s=>s?Math.round((new Date(s+"T00:00")-new Date(today()+"T00:00"))/864e5):null;
const rid=p=>{const d=new Date();return p+"-"+String(d.getFullYear()).slice(2)+String(d.getMonth()+1).padStart(2,"0")+"-"+Math.random().toString(36).slice(2,6).toUpperCase()};
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2600)}

function calcItem(it){
  const w=+it.w||0,h=+it.h||0,L=+it.l||0,q=+it.qty||0,f=(FITTINGS[it.type]||FITTINGS.straight)[1];
  const hasEnd=(it.type==="taper"||it.type==="shoe")&&+it.c>0&&+it.d>0;
  const c=hasEnd?+it.c:w,d=hasEnd?+it.d:h;
  const g=+it.gauge||autoGauge(Math.max(w,c),Math.max(h,d));
  const p1=2*(w+h)/1000,p2=2*(c+d)/1000,perim=(p1+p2)/2;
  const Le=+it.eqL||L, fe=+it.eqL?1:f;
  const area=+it.areaM2>0?+it.areaM2*q:it.type==="closing"?(w*h/1e6+p1*L/1000)*q:perim*(Le/1000)*fe*q;
  const flange=it.type==="closing"?0:(p1+p2)*q;
  const corners=it.type==="closing"?0:it.type==="shoe"?4*q:NORMS.cornersPerPiece*q;
  return {g,perim,area,kg:area*GAUGES[g].kg,flange,corners};
}
function calcWO(items,insulated){
  let area=0,kg=0;const bom={};const add=(k,v)=>{if(v>0)bom[k]=(bom[k]||0)+v};
  for(const it of items){const c=calcItem(it);const q=+it.qty||0;area+=c.area;kg+=c.kg;
    add("GI-"+c.g,c.kg*(1+NORMS.sheetWaste));
    add("TDC-FLG",c.flange); add("TDC-CNR",c.corners);
    add("GSK-TAPE",c.flange/2); add("SEAL",c.area*NORMS.sealantLperM2);
    const ins=it.insCode||(insulated?"INS-NBR":null); if(ins) add(ins,c.area*(1+NORMS.insulWaste));}
  for(const k in bom) bom[k]=Math.ceil(bom[k]*10)/10;
  return {area:Math.round(area*100)/100,kg:Math.round(kg*10)/10,bom};
}

/* ===== state ===== */
const S={db:null,user:null,uid:null,canWrite:true,materials:{},moves:[],wos:[],pos:[],tagjobs:[],dispatches:[],sync:null,loaded:{m:0,v:0,w:0,p:0},tab:"floor",woFilter:"open",q:"",names:{}};
const TABS=[["floor","Floor"],["draw","Drawings"],["wo","Work orders"],["stock","Stock"],["dispatch","Dispatches"],["plan","Material planning"],["po","Purchase"]];
try{const t=localStorage.getItem("dl-tab");if(t&&TABS.some(x=>x[0]===t))S.tab=t}catch(e){}
try{S.meeting=localStorage.getItem("dl-meeting")==="1"}catch(e){}
if(location.hash&&TABS.some(x=>x[0]===location.hash.slice(1)))S.tab=location.hash.slice(1);

/* Ledger = posted movements + movements derived from Zoho dispatches.
   A movement carrying `counted` is a stock count: on hand restarts from it, and anything
   dated before the latest count (including dispatches) is history, not deducted again. */
function dispMoves(){const out=[];for(const dp of S.dispatches){if(dp.void)continue;const {tot}=dispatchUse(dp);
  for(const[code,q]of Object.entries(tot))out.push({id:"d:"+dp.id+":"+code,code,qty:-Math.round(q*1000)/1000,type:"dispatch",ref:"Inv "+dp.invoiceNo+(dp.ewbNo?" · EWB "+dp.ewbNo:""),at:dp.at,derived:true,disp:dp.id})}return out}
function allMoves(){return S.moves.concat(dispMoves())}
const ts=s=>{const t=Date.parse(s||"");return isNaN(t)?0:t};
function lastCounts(){const c={};for(const v of S.moves)if(v.counted!=null&&(!c[v.code]||ts(v.at)>ts(c[v.code].at)))c[v.code]=v;return c}
// Dispatches before the go-live stock count (config/zoho-sync.countAt) are history for every material.
const dispCut=()=>ts(S.sync?.countAt);
function excluded(v,c){if(v.counted!=null&&c[v.code]===v)return false;const ct=c[v.code];
  if(ct&&ts(v.at)<=ts(ct.at))return true;return !!v.derived&&ts(v.at)<=dispCut()}
function onHand(){const c=lastCounts(),m={};
  for(const k in c)m[k]=+c[k].counted||0;
  for(const v of allMoves()){if(c[v.code]===v||excluded(v,c))continue;m[v.code]=(m[v.code]||0)+(+v.qty||0)}
  return m}
const countedOut=v=>excluded(v,lastCounts());
function onOrder(){const m={};for(const p of S.pos)if(p.status==="draft"||p.status==="sent")for(const l of p.lines||[])m[l.code]=(m[l.code]||0)+(+l.qty||0);return m}
const openWOs=()=>S.wos.filter(w=>w.stage!=="dispatched");
/* Material physically leaves stock when the job is invoiced/dispatched in Zoho, so every open job is demand,
   and jobs already released to the floor (issued) hold their BOM as committed until they ship. */
function demand(){const m={};for(const w of openWOs())for(const[k,v]of Object.entries(w.bom||{}))m[k]=(m[k]||0)+v;return m}
function committed(){const m={};for(const w of openWOs())if(w.materialIssued)for(const[k,v]of Object.entries(w.bom||{}))m[k]=(m[k]||0)+v;return m}
function shortFor(w,oh){const c=w.materialIssued?{}:committed(),out=[];for(const[k,v]of Object.entries(w.bom||{})){const have=(oh[k]||0)-(c[k]||0);if(have<v-1e-9)out.push([k,v-have])}return out}
const mname=k=>S.materials[k]?.name||k, muom=k=>S.materials[k]?.uom||"";
const nm=id=>id?(S.names[id]||"Someone"):"";

/* ===== shell ===== */
function renderTabs(){$("#tabs").innerHTML=TABS.map(([k,n])=>`<button role="tab" aria-selected="${S.tab===k}" data-tab="${k}">${n}</button>`).join("")}
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(!b)return;go(b.dataset.tab)});
function go(t){S.tab=t;render.force=true;try{localStorage.setItem("dl-tab",t)}catch(e){}renderTabs();render();window.scrollTo(0,0)}

function kpis(){
  const oh=onHand();const open=openWOs();
  const wip=open.filter(w=>w.stage!=="planned").length;
  const late=open.filter(w=>daysTo(w.dueDate)!==null&&daysTo(w.dueDate)<0).length;
  const due7=open.filter(w=>{const d=daysTo(w.dueDate);return d!==null&&d>=0&&d<=7}).length;
  const waiting=open.filter(w=>!w.materialIssued&&shortFor(w,oh).length).length;
  const low=Object.values(S.materials).filter(m=>(oh[m.code]||0)<(+m.reorderLevel||0)).length;
  const openPO=S.pos.filter(p=>p.status==="draft"||p.status==="sent").length;
  const k=(v,l,t,cls="")=>`<button class="kpi ${cls}" data-go="${t}"><b>${v}</b><small>${l}</small></button>`;
  return `<section class="kpis">${k(wip,"In production","floor")}${k(due7,"Due in 7 days","wo")}${k(late,"Overdue","wo",late?"alert":"")}${k(waiting,"Waiting on material","plan",waiting?"warnk":"")}${k(low,"Items below reorder","stock",low?"warnk":"")}${k(openPO,"Open POs","po")}</section>`;
}

function render(){
  const ready=S.loaded.m&&S.loaded.v&&S.loaded.w&&S.loaded.p;
  if(!ready)return;
  if(S.tab==="draw"&&$("#draw-root")&&!render.force){drawLists();return}
  render.force=false;
  const v={floor:vFloor,draw:vDraw,wo:vWO,stock:vStock,dispatch:vDispatch,plan:vPlan,po:vPO}[S.tab]();
  const ro=S.canWrite?"":`<div class="banner">You have view-only access. Ask the owner for Contributor access to update work orders and stock.</div>`;
  $("#main").innerHTML=ro+(S.tab==="draw"||(S.tab==="floor"&&S.meeting)?"":kpis())+v;
  if(S.tab==="draw")drawMounted();
  $("#foot").innerHTML=`<span>Gauge by largest side: ≤750 mm 24G · ≤1500 22G · ≤2100 20G · above 18G. Sheet wastage ${NORMS.sheetWaste*100}%.</span>`+
   (S.canWrite&&hasSample()?`<span>·</span><button class="link" data-act="clear-sample">Clear sample data</button>`:"")+
   `<div class="co"><img src="ductline-mark.png" alt=""><span>Ductline Manufacturing, Hyderabad · GSTIN 36AAXFD4390B1Z8 · info@ductline.in</span></div>`;
}
document.addEventListener("click",e=>{const g=e.target.closest("[data-go]");if(g)go(g.dataset.go)});

/* ===== views ===== */
function setupEmpty(){
  return `<div class="panel empty"><h3>Set up the factory</h3><p>Start with the material master: GI sheet by gauge, TDC flange and corners, gasket, sealant and insulation. Work orders calculate their bill of materials against these codes.</p>
  <div class="bar"><button class="btn pri" data-act="seed-master" ${S.canWrite?"":"disabled"}>Create material master</button><button class="btn" data-act="seed-sample" ${S.canWrite?"":"disabled"}>Load sample jobs to try it</button></div>
  <p class="note">Sample jobs are tagged SAMPLE and can be cleared in one click from the footer.</p></div>`;
}
/* ===== Floor board: drag cards across stages, drag within a column to set priority,
   and forecast finish dates from shop capacity (m² of finished duct per working day). ===== */
const CAP_DEF={m2PerDay:600,workDays:[1,2,3,4,5,6]}; // Mon–Sat
const cap=()=>({...CAP_DEF,...(S.cap||{})});
// Share of a job's work still to do when it sits in each stage (planned = all of it, ready = none).
const REMAIN={planned:1,cutting:.85,folding:.6,assembly:.35,insulation:.2,qc:.1,ready:0,dispatched:0};
const STAGE_I=Object.fromEntries(STAGES.map(([k],i)=>[k,i]));
function colOrder(list){return list.sort((a,b)=>{const ra=a.rank??null,rb=b.rank??null;
  if(ra!=null&&rb!=null&&ra!==rb)return ra-rb;if(ra!=null&&rb==null)return -1;if(rb!=null&&ra==null)return 1;
  return (b.priority==="urgent")-(a.priority==="urgent")||String(a.dueDate).localeCompare(String(b.dueDate))})}
function istToday(){return new Date(new Date().toLocaleString("en-US",{timeZone:"Asia/Kolkata"}))}
function addWorkdays(n){const c=cap(),d=istToday();d.setHours(0,0,0,0);let left=Math.ceil(n-1e-9);
  if(left<=0)return d.toISOString().slice(0,10);
  while(left>0){d.setDate(d.getDate()+1);if(c.workDays.includes(d.getDay()))left--}
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
/* Queue: jobs nearest to done first (later stage), then the order set on the board. */
function forecast(){
  const c=cap(),out={};let cum=0;
  const open=S.wos.filter(w=>w.stage!=="dispatched");
  const byStage=STAGES.slice().reverse().flatMap(([k])=>colOrder(open.filter(w=>w.stage===k)));
  for(const w of byStage){
    if(!(+w.area>0)){out[w.id]={eta:null,nolist:true};continue}
    cum+=(+w.area)*(REMAIN[w.stage]??1);
    const days=cum/(+c.m2PerDay||1);out[w.id]={eta:addWorkdays(days),days};
  }
  return {by:out,load:cum,days:cum/(+c.m2PerDay||1)};
}
function vFloor(){
  if(!Object.keys(S.materials).length&&!S.wos.length)return setupEmpty();
  const oh=onHand(),fc=forecast(),c=cap();
  let lateFc=0;
  const cols=STAGES.map(([k,n])=>{
    let list=S.wos.filter(w=>w.stage===k);
    if(k==="dispatched")list=list.filter(w=>daysTo((w.dispatch?.at||"").slice(0,10))>=-7);
    colOrder(list);
    const m2=list.reduce((s,w)=>s+(+w.area||0),0),rem=list.reduce((s,w)=>s+(+w.area||0)*(REMAIN[k]??0),0);
    for(const w of list){const f=fc.by[w.id];if(f?.eta&&w.dueDate&&f.eta>w.dueDate)lateFc++}

  ${!tot.sk?`<p class="note">No slit-coil purchases in this period. Raise slit coils on a PO as the "Spiral / flat-oval coil" material, or give the line a width under 1000 mm, and they'll show in the slit column.</p>`:""}

let F=null;
function woForm(w){
  F=w?JSON.parse(JSON.stringify(w)):{client:"",project:"",site:"",dueDate:"",priority:"normal",insulated:false,notes:"",items:[{type:"straight",w:"",h:"",l:"1200",qty:"1",gauge:""}]};
  modal(head(w?"Edit "+esc(w.woNo):"New work order")+`<div class="mb">
   <div class="grid"><label class="f">Client<input id="f-client" value="${esc(F.client)}" placeholder="e.g. builder or HVAC contractor"></label><label class="f">Project<input id="f-project" value="${esc(F.project)}" placeholder="Building / floor / zone"></label><label class="f">Site<input id="f-site" value="${esc(F.site)}"></label><label class="f">Due date<input id="f-due" type="date" value="${esc(F.dueDate)}"></label></div>
   <div class="bar"><label class="bar" style="font-size:14px"><input type="checkbox" id="f-urgent" ${F.priority==="urgent"?"checked":""}> Urgent</label><label class="bar" style="font-size:14px"><input type="checkbox" id="f-ins" ${F.insulated?"checked":""}> Insulated duct</label></div>
   <div><div class="bar"><p class="sec">Duct schedule</p><div class="sp"></div>${S.canWrite&&!w.materialIssued?`<label class="btn sm" for="pl-${esc(w.id)}" style="cursor:pointer">${needsList(w)?"Import part list (.xlsx)":"Replace from part list (.xlsx)"}<input type="file" id="pl-${esc(w.id)}" accept=".xlsx" data-plimport="${esc(w.id)}" hidden></label>`:""}</div><div class="tscroll"><table class="items"><thead><tr><th>Piece</th><th class="num">W mm</th><th class="num">H mm</th><th class="num">Length mm</th><th class="num">Qty</th><th>Gauge</th><th class="num">m²</th><th></th></tr></thead><tbody id="f-items"></tbody></table></div>
   <div class="bar" style="margin-top:8px"><button class="btn sm" data-act="add-row">Add piece</button><span class="note">Gauge picks itself from the largest side; override per piece if the spec says otherwise.</span></div></div>
   <div id="f-sum"></div>
   <label class="f">Notes<textarea id="f-notes" rows="2">${esc(F.notes)}</textarea></label>
  </div><div class="mf"><button class="btn" data-close>Cancel</button><button class="btn pri" data-act="save-wo">${w?"Save changes":"Create work order"}</button></div>`);

}
function drawRows(){
  $("#f-items").innerHTML=F.items.map((it,i)=>{const c=calcItem(it);const ag=autoGauge(it.w,it.h);
    return `<tr data-i="${i}"><td><select data-k="type" id="it-t-${i}">${Object.entries(FITTINGS).map(([k,[n]])=>`<option value="${k}" ${it.type===k?"selected":""}>${n}</option>`).join("")}</select></td>
    ${["w","h","l","qty"].map(k=>`<td><input class="n" inputmode="numeric" data-k="${k}" id="it-${k}-${i}" value="${esc(it[k])}"></td>`).join("")}
    <td><select data-k="gauge" id="it-g-${i}"><option value="">Auto (${ag}G)</option>${[24,22,20,18].map(g=>`<option value="${g}" ${+it.gauge===g?"selected":""}>${g}G</option>`).join("")}</select></td>
    <td class="num mono" data-area>${fmt(c.area,2)}</td><td><button class="x" data-del="${i}" aria-label="Remove piece">×</button></td></tr>`}).join("");

}
function drawSum(){
  const r=calcWO(F.items,F.insulated);
  $("#f-sum").innerHTML=`<div class="totals"><span><b>${fmt(r.area,2)}</b>m² sheet area</span><span><b>${fmt(r.kg)}</b>kg GI net</span><span><b>${F.items.reduce((s,i)=>s+(+i.qty||0),0)}</b>pieces</span></div>
  <p class="sec" style="margin-top:12px">Bill of materials</p><div class="note">${Object.entries(r.bom).map(([k,v])=>`${esc(mname(k))}: <b>${fmt(v,1)} ${esc(muom(k))}</b>`).join(" · ")||"Enter sizes to see material required."}</div>`;
}
document.addEventListener("input",e=>{
  if(!F)return;const tr=e.target.closest("#f-items tr");
  if(tr){const i=+tr.dataset.i;F.items[i][e.target.dataset.k]=e.target.value;
    if(e.target.dataset.k==="w"||e.target.dataset.k==="h"){const g=$("#it-g-"+i);if(g)g.options[0].text=`Auto (${autoGauge(F.items[i].w,F.items[i].h)}G)`}
    tr.querySelector("[data-area]").textContent=fmt(calcItem(F.items[i]).area,2);drawSum();return}
  if(e.target.id==="f-ins"){F.insulated=e.target.checked;drawSum()}
});
document.addEventListener("change",e=>{if(F&&e.target.closest("#f-items tr")){const i=+e.target.closest("tr").dataset.i;F.items[i][e.target.dataset.k]=e.target.value;drawRows()}});
document.addEventListener("click",e=>{const d=e.target.closest("[data-del]");if(d&&F){F.items.splice(+d.dataset.del,1);if(!F.items.length)F.items.push({type:"straight",w:"",h:"",l:"1200",qty:"1",gauge:""});drawRows()}});

async function saveWO(){
  const v=id=>$(id).value.trim();
  Object.assign(F,{client:v("#f-client"),project:v("#f-project"),site:v("#f-site"),dueDate:v("#f-due"),notes:v("#f-notes"),priority:$("#f-urgent").checked?"urgent":"normal",insulated:$("#f-ins").checked});
  const items=F.items.filter(i=>+i.w>0&&+i.h>0&&+i.l>0&&+i.qty>0);
  if(!F.client)return toast("Enter the client name.");
  if(!items.length)return toast("Add at least one piece with width, height, length and quantity.");
  const r=calcWO(items,F.insulated);
  const doc={client:F.client,project:F.project,site:F.site,dueDate:F.dueDate,priority:F.priority,insulated:F.insulated,notes:F.notes,items,area:r.area,kg:r.kg,bom:r.bom,updatedAt:new Date().toISOString()};
  try{
    if(F.id){await S.db.doc("workorders/"+F.id).update(doc);toast(F.woNo+" updated")}
    else{const woNo=rid("WO");await S.db.collection("workorders").add({...doc,woNo,stage:"planned",materialIssued:false,stageLog:[{s:"planned",at:new Date().toISOString(),by:S.uid}],createdAt:new Date().toISOString(),createdBy:S.uid});toast(woNo+" created")}
    F=null;closeM();
  }catch(err){dbErr(err)}
}

/* --- work order detail --- */
function woDetail(id){
  const w=S.wos.find(x=>x.id===id);if(!w)return;F=null;const oh=onHand();const short=shortFor(w,oh);
  const si=STAGES.findIndex(s=>s[0]===w.stage);
  const stg=STAGES.map(([k,n],i)=>`<span class="stg ${k==="insulation"&&!w.insulated?"skip":i<si?"done":i===si?"cur":""}">${n}</span>`).join("");
  const bom=Object.entries(w.bom||{}).map(([k,v])=>{const have=oh[k]||0;const ok=w.materialIssued||have>=v;return `<tr><td>${esc(mname(k))} <span class="note mono">${esc(k)}</span></td><td class="num"><b>${fmt(v,1)}</b> ${esc(muom(k))}</td><td class="num">${w.materialIssued?"—":fmt(have,1)}</td><td>${w.materialIssued?'<span class="chip ok">Issued</span>':ok?'<span class="chip ok">Available</span>':`<span class="chip bad">Short ${fmt(v-have,1)}</span>`}</td></tr>`}).join("");
  const items=(w.items||[]).map(it=>{const c=calcItem(it);const end=(it.type==="taper"||it.type==="shoe")&&it.c?` → ${it.c} × ${it.d}`:"";return `<tr><td>${it.mark?`<b class="mono">${esc(it.mark)}</b> `:""}${esc(it.label||FITTINGS[it.type]?.[0]||it.type)}${it.insName?`<div class="note">${esc(it.insName)}</div>`:""}</td><td class="num mono">${it.w} × ${it.h}${end}</td><td class="num mono">${it.l}</td><td class="num">${it.qty}</td><td>${c.g}G</td><td class="num">${fmt(c.area,2)}</td></tr>`}).join("");
  const log=(w.stageLog||[]).slice().reverse().map(l=>`<div class="note">${dtfmt(l.at)} · ${esc(STAGE_N[l.s]||l.s)}${l.by?" · "+esc(nm(l.by)):""}${l.note?" · "+esc(l.note):""}</div>`).join("");
  const canEdit=S.canWrite&&w.stage==="planned"&&!w.materialIssued;
  modal(head(`${esc(w.woNo)} <span class="muted" style="font-weight:500">· ${esc(w.client)}</span>`)+`<div class="mb">
   <div class="bar">${w.sample?'<span class="chip sample">SAMPLE</span>':""}${w.priority==="urgent"?'<span class="chip warn">Urgent</span>':""}${dueChip(w)}${matChip(w,oh)}<span class="note">${esc([w.project,w.site].filter(Boolean).join(" · "))}</span></div>
   ${w.clientPO||w.clientStatus||w.source?.url?`<div class="note">${w.clientStatus?esc(w.clientStatus):""}${w.clientPO?` · Client PO <b class="mono">${esc(w.clientPO)}</b>`:""}${w.source?.url?` · <a href="${esc(w.source.url)}" target="_blank" rel="noopener">Open email thread</a>`:""}</div>`:""}
   <div class="stages">${stg}</div>
   <div class="totals"><span><b>${fmt(w.area,2)}</b>m²</span><span><b>${fmt(w.kg)}</b>kg GI net</span><span><b>${(w.items||[]).reduce((s,i)=>s+(+i.qty||0),0)}</b>pieces</span>${w.insulated?"<span><b>Yes</b>insulated</span>":""}</div>
   <div><p class="sec">Bill of materials</p><div class="tscroll"><table><thead><tr><th>Material</th><th class="num">Required</th><th class="num">In stock</th><th></th></tr></thead><tbody>${bom}</tbody></table></div>
   ${needsList(w)?`<div class="banner" style="margin-top:10px">No part list on this job yet. Import Arvind's part-list Excel below, or tag the drawing in the Drawings tab.</div>`:""}
   ${!w.materialIssued&&S.canWrite&&!needsList(w)?`<div class="bar" style="margin-top:10px"><button class="btn haz" data-issue="${esc(w.id)}" ${short.length?"disabled":""}>Issue material to floor</button>${short.length?`<span class="note">Short on ${short.length} item${short.length>1?"s":""}. Receive stock or raise a PO from Material planning.</span>`:`<span class="note">Reserves the BOM and releases the job to cutting. Stock comes off when the Zoho invoice goes out.</span>`}</div>`:w.issuedAt?`<p class="note">Issued ${dtfmt(w.issuedAt)}${w.issuedBy?" by "+esc(nm(w.issuedBy)):""}</p>`:""}</div>
   <div><p class="sec">Duct schedule</p><div class="tscroll"><table><thead><tr><th>Piece</th><th class="num">Size mm</th><th class="num">Length</th><th class="num">Qty</th><th>Gauge</th><th class="num">m²</th></tr></thead><tbody>${items}</tbody></table></div></div>
   ${w.dispatch?`<div><p class="sec">Dispatch</p><p class="note">${dtfmt(w.dispatch.at)} · Vehicle ${esc(w.dispatch.vehicle||"—")} · DC ${esc(w.dispatch.dc||"—")}${w.dispatch.note?" · "+esc(w.dispatch.note):""}</p></div>`:""}
   ${w.notes?`<div><p class="sec">Notes</p><p style="margin:0">${esc(w.notes)}</p></div>`:""}
   ${(()=>{const j=S.tagjobs.find(x=>x.woId===w.id||x.id===w.source?.tagJob);return j?.pack?`<div class="bar"><button class="btn pri" data-tjview="${esc(j.id)}">View tagged drawing</button><button class="btn" data-tjpdf="${esc(j.id)}">Drawing PDF</button><span class="note">${esc(j.file)}</span></div>`:""})()}
   <div><p class="sec">History</p>${log}</div>
  </div><div class="mf">${S.canWrite&&!w.materialIssued&&w.stage==="planned"?`<button class="btn danger" data-delwo="${esc(w.id)}">Delete</button>`:""}<span style="flex:1"></span>${canEdit?`<button class="btn" data-editwo="${esc(w.id)}">Edit</button>`:""}${S.canWrite&&si>0&&w.stage!=="dispatched"?`<button class="btn" data-move="-1" data-id="${esc(w.id)}">‹ Back</button>`:""}${S.canWrite&&si<STAGES.length-1?`<button class="btn pri" data-move="1" data-id="${esc(w.id)}">${w.stage==="ready"?"Dispatch":"Move to "+esc(STAGE_N[nextStage(w,1)])}</button>`:""}</div>`);
}
function nextStage(w,dir){let i=STAGES.findIndex(s=>s[0]===w.stage)+dir;if(STAGES[i]?.[0]==="insulation"&&!w.insulated)i+=dir;return STAGES[Math.max(0,Math.min(STAGES.length-1,i))][0]}
async function move(id,dir){
  const w=S.wos.find(x=>x.id===id);if(!w)return;
  if(dir>0&&w.stage==="planned"&&!w.materialIssued){woDetail(id);return toast("Issue material before the job goes to cutting.")}
  if(dir>0&&w.stage==="ready")return dispatchForm(w);
  const to=nextStage(w,dir);
  try{await S.db.doc("workorders/"+id).update({stage:to,stageLog:[...(w.stageLog||[]),{s:to,at:new Date().toISOString(),by:S.uid,...(dir<0?{note:"moved back"}:{})}]});toast(`${w.woNo} → ${STAGE_N[to]}`);if($("#modal").innerHTML)woDetail(id)}catch(err){dbErr(err)}
}
function dispatchForm(w){
  modal(head("Dispatch "+esc(w.woNo))+`<div class="mb"><div class="grid"><label class="f">Vehicle number<input id="d-veh" placeholder="TS 09 AB 1234"></label><label class="f">Delivery challan no.<input id="d-dc"></label></div><label class="f">Note<input id="d-note" placeholder="Received by, site contact"></label></div>
  <div class="mf"><button class="btn" data-close>Cancel</button><button class="btn pri" data-dispatch="${esc(w.id)}">Mark dispatched</button></div>`,true);
}
async function doDispatch(id){
  const w=S.wos.find(x=>x.id===id);const at=new Date().toISOString();
  try{await S.db.doc("workorders/"+id).update({stage:"dispatched",dispatch:{vehicle:$("#d-veh").value.trim(),dc:$("#d-dc").value.trim(),note:$("#d-note").value.trim(),at,by:S.uid},stageLog:[...(w.stageLog||[]),{s:"dispatched",at,by:S.uid}]});closeM();toast(w.woNo+" dispatched")}catch(err){dbErr(err)}
}
async function issue(id){
  const w=S.wos.find(x=>x.id===id);const oh=onHand();
  if(needsList(w))return toast("Import the part list before issuing material.");
  if(shortFor(w,oh).length)return toast("Stock changed. Material is now short.");
  try{const at=new Date().toISOString();
    await S.db.doc("workorders/"+id).update({materialIssued:true,issuedAt:at,issuedBy:S.uid});toast("Material released for "+w.woNo);woDetail(id)}catch(err){dbErr(err)}
}

function coilCell(l,i,ed){const c=coilInfo(l);if(!c)return `<span class="note">—</span>`;
  if(!ed)return `${c.slit?`<span class="chip info">Slit${c.width?" "+c.width+" mm":""}</span>`:`<span class="chip">Full ${c.width||1250} mm</span>`}${l.coil?` <span class="mono note">${esc(l.coil)}</span>`:""}${l.spec?`<div class="note">${esc(l.spec)}</div>`:""}`;
  return `<div style="display:flex;gap:6px;min-width:220px"><input class="n" style="width:92px" placeholder="${c.slit?"slit mm":"1250"}" data-pl="${i}" data-k="width" value="${esc(l.width||"")}" aria-label="Coil width mm"><input placeholder="Coil no." data-pl="${i}" data-k="coil" value="${esc(l.coil||"")}" aria-label="Coil number"></div>`}

  P.supplier=$("#po-sup").value.trim();P.lines=P.lines.filter(l=>l.code&&+l.qty>0).map(l=>({code:l.code,qty:+l.qty,rate:+l.rate||0,...(l.width?{width:+l.width}:{}),...(l.coil?{coil:String(l.coil).trim()}:{}),...(l.spec?{spec:l.spec}:{})}));

async function receivePO(){
  const p=S.pos.find(x=>x.id===P.id);const grn=$("#po-grn")?.value.trim()||"";const at=new Date().toISOString();
  // a narrow (slit) coil booked against a full-width code goes to that gauge's slit-coil stock
  const stockCode=l=>{const c=coilInfo(l);return c&&c.slit&&!/-FO$/.test(l.code)&&S.materials[l.code+"-FO"]?l.code+"-FO":l.code};

/* --- dispatches (from Zoho invoices / e-way bills) --- */
const normRef=s=>String(s||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
function woFor(dp){const r=normRef(dp.ref);if(r.length<5)return null;return S.wos.find(w=>{const p=normRef(w.clientPO);return p.length>=5&&(r.includes(p)||p.includes(r))})||null}
const giKg=tot=>Object.entries(tot).filter(([k])=>k.startsWith("GI-")).reduce((s,[,v])=>s+v,0);
function vDispatch(){
  const list=[...S.dispatches].sort((a,b)=>ts(b.at)-ts(a.at));const cnt=lastCounts();
  const sync=S.sync?.lastRun?`Synced from Zoho ${dtfmt(S.sync.lastRun)}`:"Waiting for first Zoho sync";
  const since=Date.now()-7*864e5;let wk={m2:0,kg:0,n:0};
  const rows=list.map(dp=>{const {lines,tot}=dispatchUse(dp);const m2=lines.filter(l=>/sq|m2|m²/i.test(l.unit||"")).reduce((s,l)=>s+(+l.qty||0),0);const kg=giKg(tot);
    const pre=Object.keys(tot).length&&Object.keys(tot).every(k=>excluded({code:k,at:dp.at,derived:true},cnt));const unm=lines.some(l=>l.skip&&!/zero|labour/.test(l.skip));
    if(!dp.void&&ts(dp.at)>=since){wk.m2+=m2;wk.kg+=kg;wk.n++}
    const w=woFor(dp);
    const st=dp.void?`<span class="chip bad">Void</span>`:!Object.keys(tot).length?`<span class="chip">No tracked material</span>`:pre?`<span class="chip">Before stock count</span>`:`<span class="chip ok">Deducted</span>`;
    const untracked=[...new Set(lines.filter(l=>l.skip&&!/zero|labour/.test(l.skip)).map(l=>l.name.trim()))];
    return `<tr class="click" data-disp="${esc(dp.id)}"><td>${dtfmt(dp.at)}</td><td class="mono">${esc(dp.invoiceNo)}</td><td class="mono">${dp.ewbNo?esc(dp.ewbNo):`<span class="muted">none</span>`}</td><td><b>${esc(dp.customer)}</b><div class="note">${esc((dp.shipTo||"").split("\n")[0])}${w?` · <span class="chip info">${esc(w.woNo)}</span>`:""}</div></td><td class="num">${fmt(m2,1)}</td><td class="num">${fmt(kg,0)}</td><td>${st}${untracked.length?`<div class="note">Not tracked: ${esc(untracked.join(", "))}</div>`:""}</td></tr>`}).join("");
  return `<div class="bar"><h2>Dispatches</h2><span class="muted hide-sm">${esc(sync)}. Each Zoho invoice is a dispatch; its lines take material out of stock.</span></div>
  <div class="totals panel" style="padding:14px 16px;margin-bottom:12px"><span><b>${wk.n}</b>dispatches, last 7 days</span><span><b>${fmt(wk.m2,0)}</b>m² sent</span><span><b>${fmt(wk.kg,0)}</b>kg GI used</span></div>
  <div class="panel tscroll"><table><thead><tr><th>When</th><th>Invoice</th><th>E-way bill</th><th>Customer / site</th><th class="num">m²</th><th class="num">GI kg</th><th>Stock</th></tr></thead><tbody>${rows||`<tr><td colspan="7" class="muted">No dispatches yet. They appear here as invoices are raised in Zoho.</td></tr>`}</tbody></table></div>
  <p class="note" style="margin-top:10px">Rules: GI kg = m² × gauge kg/m² + ${NORMS.sheetWaste*100}% wastage. TDF ducts also use ${DISPATCH.tdf.flgM} m flange, ${DISPATCH.tdf.cnr} corners (or the count written on the invoice), ${DISPATCH.tdf.gskM} m gasket and ${DISPATCH.tdf.sealL} L sealant per m². Flat-oval and spiral lines draw on the spiral coil. Insulation lines draw by thickness + ${DISPATCH.insWaste*100}%. Dispatches before a material's latest stock count are shown but not deducted again.</p>`;
}

/* ===== Drawings: DWG/DXF upload -> auto tagging -> part list, tagged drawing, work order ===== */
const ENGINE_CDN="https://cdn.jsdelivr.net/npm/@mlightcad/libredwg-web@0.7.16/dist/libredwg-web.js";
const T={file:null,kind:null,buf:null,dxfText:null,ents:null,header:null,res:null,rows:null,opts:null,job:{client:"",name:"",floor:"",dlno:"1"},view:null,jobId:null,busy:"",insMode:"split",acoLen:1524,saved:null};
let ENGINE_MOD=null;
const SETKEYS=[["module","Sheet module","mm"],["flangeAllow","Flange allowance per piece","mm"],["inchToMm","Inch to mm (shop)","mm"],["collarAllow","Collar allowance","mm"],["shoeExtra","Shoe mouth extra width","mm"],["shoeLen","Shoe length","mm"],["lenTol","Same-piece tolerance","mm"]];
function tagOpts(){
  const o=Object.assign({},DLTag.DEF,T.opts||{});
  o.insulation=T.insMode==="none"?[]:T.insMode==="thermal"?[{name:"9MM THERMAL",code:"INS-NBR-9"}]:
    [{name:"10MM ACCOUSTIC",code:"INS-ACO-10",upto:+T.acoLen||0},{name:"9MM THERMAL",code:"INS-NBR-9"}];
  return o;
}
/* a fresh reader per drawing: the reader cannot safely open a second file in one instance */
async function loadEngine(){
  let err=null;
  const base=new URL(".",location.href).href.replace(/\/$/,"");
  if(!ENGINE_MOD)for(const src of [ENGINE_CDN,"./dwg/dist/libredwg-web.js"]){try{ENGINE_MOD=await import(src);break}catch(e){err=e}}
  if(!ENGINE_MOD)throw new Error("engine-load: "+(err&&err.message));
  const lib=await ENGINE_MOD.LibreDwg.create(base);
  lib._types=ENGINE_MOD.Dwg_File_Type;

async function openDrawing(file){

      const lib=await loadEngine();

      await new Promise(r=>setTimeout(r,30));

    console.error(e);T.busy="";T.ents=null;

      m==="not-dwg"?"That file isn't a DWG drawing. Upload a .dwg or .dxf file.":
      "Could not read this drawing. Try saving it as DXF from AutoCAD and uploading that.";
    render.force=true;render();

}

      <b>Drop a DWG, DXF, PDF or photo here, or tap to choose</b><span class="note">DWG and DXF drawings are read in this browser; sizes come from labels like 22(W)X12(H) or from dimensions. A client's requirement sheet (PDF, scan or phone photo, even handwritten) is read by Claude into the same part list. Set a piece's quantity to 0 to leave it out.</span></label>

  const sets=SETKEYS.map(([k,n,u])=>`<label class="f">${n} (${u})<input id="ts-${k}" data-ts="${k}" inputmode="numeric" value="${esc(tagOpts()[k])}"></label>`).join("");

function bboxOf(pts){let a=[Infinity,Infinity,-Infinity,-Infinity];pts.forEach(p=>{if(!p||!isFinite(p.x)||!isFinite(p.y))return;a[0]=Math.min(a[0],p.x);a[1]=Math.min(a[1],p.y);a[2]=Math.max(a[2],p.x);a[3]=Math.max(a[3],p.y)});return a}
function sceneOf(){
  if(T.scene&&T.scene.res===T.res)return T.scene;
  const base=[],texts=[];
  (T.ents||[]).forEach(e=>{
    if(e.type==="LINE")base.push([e.startPoint,e.endPoint]);
    else if(e.type==="LWPOLYLINE"&&e.vertices&&e.vertices.length>1){const v=e.vertices.slice();if((e.flag&1)||(e.flag&512))v.push(v[0]);base.push(v)}

    else if((e.type==="TEXT"||e.type==="MTEXT")&&e.text){const p=e.insertionPoint||e.startPoint;if(p)texts.push({p,t:DLTag.cleanText(e.text).slice(0,48),h:e.textHeight||e.height||2.5})}

async function pdfPages(file,max){
  const lib=await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js","pdfjsLib");
  lib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const doc=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;const out=[];
  for(let i=1;i<=Math.min(doc.numPages,max);i++){const pg=await doc.getPage(i);const v0=pg.getViewport({scale:1});const sc=Math.min(3,1800/Math.max(v0.width,v0.height));const v=pg.getViewport({scale:sc});
    const cv=document.createElement("canvas");cv.width=Math.round(v.width);cv.height=Math.round(v.height);const ctx=cv.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,cv.width,cv.height);
    await pg.render({canvasContext:ctx,viewport:v}).promise;out.push(await new Promise(r=>cv.toBlob(r,"image/png")))}
  return {blobs:out,pages:doc.numPages};
}
const REQ_PROMPT=`You are reading a duct requirement sent to Ductline Manufacturing, a sheet-metal HVAC duct fabricator. The attached image(s) are a client's requirement: it may be handwritten, typed, a table, or include small sketches with dimensions. All sizes are millimetres unless marked otherwise (convert inches to mm only if the sheet clearly uses inches).

Read EVERY piece requested and reply with only this JSON:
{"project": string|null, "client": string|null,
 "items": [ { "no": string (the item number written on the sheet, else its order),
   "text": string (exactly what is written for this item, verbatim, including quantities),
   "kind": "straight"|"shoe"|"taper"|"elbow"|"offset"|"closing"|"collar"|"other",
   "W": number, "H": number,        // size at the main end: W = first number written / the width, H = second / the depth
   "W2": number|null, "H2": number|null, // size at the other end, only for shoe pieces and tapers
   "L": number|null,                // length of the piece (straight length, taper length, or the shoe piece's height/depth)
   "angle": number|null,            // bends only
   "qty": number,
   "confidence": "high"|"low",      // "low" if any digit or the quantity is hard to read or ambiguous
   "doubt": string|null } ],        // when low: what exactly is unclear, e.g. "quantity could be 3 or 30"
 "notes": [string] }

How to read common items:
- "1450 x 400 (Length - 400mm - 1 No's)" -> straight, W 1450, H 400, L 400, qty 1.
- A sketch of a rectangle with one sloping side, wider at one end (for example 650 at the top and 600 at the bottom, 200 high) with a duct size like "600 x 150 -> 3 Nos": that is a shoe piece (a collar that sits on a duct, mouth wider than neck): kind "shoe", W = the wider end (650), W2 = the narrower end (600), H = H2 = the depth (150), L = the height of the sketch (200), qty from the note.
- A size changing from one size to another along a length -> taper. A bend or elbow with an angle -> elbow. A blank or end plate -> closing.
Never invent numbers that are not on the sheet; use null when a value is not given. Do not merge separate items.`;
async function openRequirement(file){
  (T.req?.urls||[]).forEach(u=>URL.revokeObjectURL(u));
  Object.assign(T,{file:file.name,kind:"req",res:null,rows:null,ents:null,buf:null,jobId:null,woId:null,saved:null,scene:null,view:null,req:null,error:null});
  T.job.name=T.job.name||file.name.replace(/\.[a-z]+$/i,"").replace(/[_-]+/g," ").trim();T.insMode=T.insMode==="split"?"none":T.insMode;
  try{
    const sample=await claude.use("sample");if(!sample)throw {code:"unavailable"};
    const lim=await sample.limits().catch(()=>null);if(!lim?.images)throw {code:"images_unavailable"};
    T.busy="Preparing "+file.name+"…";render.force=true;render();
    let blobs;if(/\.pdf$/i.test(file.name)||file.type==="application/pdf"){const r=await pdfPages(file,lim.images.maxCount||4);blobs=r.blobs;if(r.pages>blobs.length)toast(`Only the first ${blobs.length} pages are read.`)}else blobs=[file];
    T.busy="Claude is reading the requirement… this usually takes 20–60 seconds";render.force=true;render();
    const j=await sample.json(REQ_PROMPT,{images:blobs,modelTier:"complex"});
    const items=(Array.isArray(j?.items)?j.items:[]).filter(x=>x&&(+x.W>0||+x.L>0));
    if(!items.length)throw {code:"empty"};
    T.req={items,notes:Array.isArray(j.notes)?j.notes:[],blobs,urls:blobs.map(b=>URL.createObjectURL(b))};
    if(j.project&&!T.job.nameTouched)T.job.name=String(j.project);if(j.client&&!T.job.client)T.job.client=String(j.client);
    T.busy="";runTag();
  }catch(e){console.error(e);T.busy="";T.req=null;
    T.error=e?.code==="not_granted"?"Reading requirement sheets needs your OK for this page to use Claude. Upload again and choose Allow.":
      e?.code==="images_unavailable"||e?.code==="unavailable"||e?.code==="sampling_disabled"?"Reading PDFs and photos isn't available in this view. Open the page in claude.ai, or upload a DWG/DXF.":
      e?.code==="rate_limited"?"Claude is busy for your account right now. Try again in a minute.":
      e?.code==="empty"||e?.code==="invalid_json"?"Couldn't find any duct items on that sheet. Check the photo is clear and upright, then try again.":
      e?.code==="image_rejected"?"That image couldn't be read. Try a JPG or PNG under 20 MB.":
      /Could not load/.test(e?.message||"")?"Couldn't load the PDF reader. Check the connection, or upload a photo of the page.":"Couldn't read that sheet. Try again, or upload a clearer photo.";
    render.force=true;render()}
}
function reqRes(o){
  const zone=T.insMode==="thermal"&&o.insulation.length?o.insulation[0]:null;
  const gauge=(...s)=>{const mx=Math.max(...s.filter(v=>v>0));for(const [lim,g] of o.gaugeBands)if(mx<=lim)return g;return 18};
  const rows=[],warn=[];const fabM=Math.round(o.module-o.flangeAllow);
  T.req.items.forEach((it,i)=>{
    const no=String(it.no??i+1).replace(/[^\w.\-]/g,"")||String(i+1);const W=+it.W||0,H=+it.H||0,W2=+it.W2||W,H2=+it.H2||H,L=+it.L||0,q=Math.max(0,Math.round(+it.qty||0))||1;
    const base={mark:no,dl:1,ext1:0,ext2:0,E:0,zone,conn:"TDF",A:W,B:H,C:W,D:H,qty:q};
    if(it.confidence==="low")warn.push(`Item ${no}: ${it.doubt||"hard to read"} — check against the sheet (“${it.text||""}”).`);
    if(!(W>0&&H>0)){warn.push(`Item ${no}: size not given (“${it.text||""}”). Left out.`);return}
    const k=String(it.kind||"straight");
    if(k==="shoe")rows.push({...base,kind:"shoe",type:"Shoe Piece",conn:"Rev. Flange- no flange",A:Math.max(W,W2),C:Math.min(W,W2),B:H,D:H2,L:L||o.shoeLen});
    else if(k==="taper")rows.push({...base,kind:"taper",type:"Taper",C:W2,D:H2,L:L||300});
    else if(k==="elbow")rows.push({...base,kind:"elbow",type:"Elbow",E:+it.angle||90,ext1:o.elbowExt,ext2:o.elbowExt,L:o.elbowThroat});
    else if(k==="offset")rows.push({...base,kind:"offset",type:"Offset",L:L||300});
    else if(k==="closing")rows.push({...base,kind:"closing",type:"Closing Sheet",L:o.closingLen});
    else if(k==="collar")rows.push({...base,kind:"neck",type:"Small Duct",conn:"TDF-NO FLANGE",L:L||100});
    else{
      if(!L){warn.push(`Item ${no}: length not given (“${it.text||""}”). Left out.`);return}
      if(L<=o.module){rows.push({...base,kind:"duct",type:L<o.smallBelow?"Small Duct":"Straight Duct",L})}
      else{let n=Math.floor(L/fabM),rem=L-n*fabM;const parts=Array(n).fill(fabM);if(rem>0){if(rem<o.mergeBelow&&parts.length)parts[parts.length-1]+=rem;else parts.push(rem)}
        const g=new Map();parts.forEach(p=>g.set(p,(g.get(p)||0)+1));let sfx=0;
        for(const [p,c] of g){rows.push({...base,mark:g.size>1?`${no}${String.fromCharCode(65+sfx++)}`:no,kind:"duct",type:p<o.smallBelow?"Small Duct":"Straight Duct",L:p,qty:q*c})}
        warn.push(`Item ${no}: ${L} mm split into ${parts.join(" + ")} mm pieces.`)}
    }
  });
  rows.forEach(r=>r.gauge=gauge(r.A,r.B,r.C,r.D));
  return {req:true,rows,runs:[],collars:[],pieces:[],warnings:warn};
}

    const row=ws.getRow(r++);vals.forEach((v,i)=>{const cell=row.getCell(i+1);cell.value=v;cell.border=border;if(typeof v==="number"&&!Number.isInteger(v))cell.numFmt="0.00"});
    tot.qty+=p.qty;tot.sqft+=c.sqft;tot.g[p.gauge]=(tot.g[p.gauge]||0)+c.sqft;if(z)tot.z[z]=(tot.z[z]||0)+c.sqft;tot.tdf+=c.tdf;tot.rev+=c.rev;tot.cor+=c.corners;

async function tagXlsx(rows,job){try{toast("Building part list…");const b=await buildXlsx(rows,job,[...new Set(rows.map(r=>r.zone?r.zone.name:null).filter(Boolean))]);await saveFile(safeName((job.name||"PART LIST")+" PART-LIST")+".xlsx",b)}catch(e){console.error(e);toast("Couldn't build the Excel file. Check the connection and try again.")}}
async function tagZip(){
  try{
    toast("Building tagged drawing…");
    const JSZip=await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js","JSZip");
    const ov=T.res.fab?T.res.fabOv:DLTag.overlay(T.res);const ins=T.header&&(T.header.INSUNITS??T.header.$INSUNITS);
    let full=null;
    try{
      if(T.kind==="dxf")full=DLTag.injectDxf(T.dxfText,ov,"DL-TAG",1);
      else{const lib=await loadEngine();const bytes=lib.dwg_write_dxf(T.buf.slice(0));if(bytes)full=DLTag.injectDxf(new TextDecoder("utf-8").decode(bytes),ov,"DL-TAG",1)}
    }catch(e){console.error(e)}
    const base=safeName(T.file.replace(/\.(dwg|dxf)$/i,""));
    const zip=new JSZip();
    if(full)zip.file(base+" - TAGGED.dxf",full);
    zip.file(base+" - TAGS ONLY.dxf",DLTag.tagsOnlyDxf(ov,ins,"DL-TAG",1));
    zip.file(base+" - PART-LIST.xlsx",await buildXlsx(T.rows,T.job,XLSX_ZONES()));
    zip.file("README.txt",["Ductline Factory OS — tagged drawing","",
      full?"• "+base+" - TAGGED.dxf: the client drawing with piece breaks and tags on layer DL-TAG. Open in AutoCAD and Save As DWG. If AutoCAD reports errors, run RECOVER.":"• The full drawing could not be re-written in this browser; use the tags-only file below.",
      "• "+base+" - TAGS ONLY.dxf: just the tags, in the same coordinates. In the original DWG: INSERT this file at 0,0, scale 1, explode — the tags land on the ducts.",
      "• "+base+" - PART-LIST.xlsx: part list in the Ductline format.","",
      `Rules: module ${tagOpts().module} mm, flange allowance ${tagOpts().flangeAllow} mm, inch = ${tagOpts().inchToMm} mm, remainder ${tagOpts().remainder}.`].join("\r\n"));
    const blob=await zip.generateAsync({type:"blob",compression:"DEFLATE"});
    if(await saveFile(base+" - TAGGED.zip",blob))saveTagJob();
  }catch(e){console.error(e);toast("Couldn't build the tagged drawing. Check the connection and try again.")}
}
function compactRows(rows){return rows.map(r=>({mark:r.mark,kind:r.kind,type:r.type,conn:r.conn,gauge:r.gauge,dl:r.dl||null,ext1:r.ext1||0,ext2:r.ext2||0,A:r.A,B:r.B,C:r.C,D:r.D,E:r.E||0,L:r.L,qty:r.qty,zone:r.zone?{name:r.zone.name,code:r.zone.code}:null}))}
async function saveTagJob(){
  if(!S.canWrite||!S.db)return;
  const t=rowsCalc();
  const doc={file:T.file,client:T.job.client,name:T.job.name,floor:T.job.floor,dlno:T.job.dlno,rows:compactRows(T.rows),qty:t.qty,sqft:Math.round(t.sqft*100)/100,
    rules:{...tagOpts(),insulation:tagOpts().insulation.map(z=>({...z}))},runs:T.res.runs.length,collars:T.res.collars.length,warnings:T.res.warnings,updatedAt:new Date().toISOString()};
  try{
    if(T.jobId)await S.db.doc("tagjobs/"+T.jobId).update(doc);
    else{const ref=await S.db.collection("tagjobs").add({...doc,createdAt:new Date().toISOString(),by:S.uid});T.jobId=ref.id}
    if(T.woId)await S.db.doc("tagjobs/"+T.jobId).update({woId:T.woId});
    T.saved=true;
    if(T.req){if(!T.req.stored){const im=await uploadReqImage();if(im){T.req.stored=true;await S.db.doc("tagjobs/"+T.jobId).update({reqImg:im,source:"requirement"})}}}
    else if(T.packRes!==T.res){const pk=await uploadPack();if(pk){T.packRes=T.res;await S.db.doc("tagjobs/"+T.jobId).update({pack:pk})}}
  }catch(e){dbErr(e)}
}
function rowsToItems(rows){
  const tmap={duct:null,taper:"taper",closing:"closing",shoe:"shoe",cshoe:"shoe",neck:"small",elbow:"elbow",offset:"offset"};
  return rows.filter(r=>r.qty>0).map(r=>{const c=DLTag.rowCalc(r);return {type:tmap[r.kind]||(/small/i.test(r.type)?"small":"straight"),label:r.type+(r.kind==="elbow"?` ${r.E}°`:""),mark:String(r.mark),conn:r.conn,dl:r.dl||null,
    eqL:r.kind==="elbow"?String(Math.round(c.bend)):r.kind==="offset"?String(r.L+(r.ext1||0)+(r.ext2||0)):"",
    w:String(r.A),h:String(r.B),c:String(r.C),d:String(r.D),l:String(r.L),qty:String(r.qty),gauge:String(r.gauge),
    insCode:r.zone?r.zone.code:"",insName:r.zone?r.zone.name:""}});
}
async function tagWO(rows,job,fromJobId){
  if(T.woId&&!fromJobId){const w=S.wos.find(x=>x.id===T.woId);if(w)return woDetail(w.id)}
  const items=rowsToItems(rows);const r=calcWO(items,false);const woNo=rid("WO");const at=new Date().toISOString();
  try{
    const ref=await S.db.collection("workorders").add({woNo,client:job.client||"Client not set",project:[job.name,job.floor&&("Floor "+job.floor)].filter(Boolean).join(" · "),site:"",dueDate:"",priority:"normal",
      insulated:items.some(i=>i.insCode),notes:"Created from drawing "+(job.file||T.file||"")+(job.dlno?" · DL "+job.dlno:""),items,area:r.area,kg:r.kg,bom:r.bom,stage:"planned",materialIssued:false,
      stageLog:[{s:"planned",at,by:S.uid}],createdAt:at,createdBy:S.uid,source:{kind:"drawing",file:job.file||T.file,tagJob:fromJobId||T.jobId||null}});
    if(fromJobId){await S.db.doc("tagjobs/"+fromJobId).update({woId:ref.id})}
    else{T.woId=ref.id;await saveTagJob()}
    toast(woNo+" created from the drawing. Set the due date.");
    const missing=[...new Set(Object.keys(r.bom).filter(k=>!S.materials[k]))];
    if(missing.length)toast("Add "+missing.join(", ")+" to the material master so stock can be issued.");
    setTimeout(()=>woDetail(ref.id),300);
  }catch(e){dbErr(e)}
}
function jobDetail(id){
  const j=S.tagjobs.find(x=>x.id===id);if(!j)return;
  const rows=(j.rows||[]).map(r=>({...r,...DLTag.rowCalc(r)}));
  modal(head(esc(j.file))+`<div class="mb"><div class="note">${esc([j.client,j.name,j.floor&&("Floor "+j.floor)].filter(Boolean).join(" · "))} · tagged ${dtfmt(j.createdAt)}</div>
    <div class="tscroll"><table><thead><tr><th>Tag</th><th>Piece</th><th class="num">Size mm</th><th class="num">Length</th><th class="num">Qty</th><th class="num">Sq ft</th><th>Insulation</th></tr></thead><tbody>${rows.map(r=>`<tr><td class="mono"><b>${esc(r.mark)}</b></td><td>${esc(r.type)}</td><td class="num mono">${r.A}×${r.B}${r.C!==r.A||r.D!==r.B?` → ${r.C}×${r.D}`:""}</td><td class="num">${r.L}</td><td class="num">${r.qty}</td><td class="num">${fmt(r.sqft,2)}</td><td>${esc(r.zone?r.zone.name:"—")}</td></tr>`).join("")}</tbody></table></div>
    ${j.pack||j.reqImg?"":`<p class="note">This drawing was tagged before drawings were kept in the app. Upload the DWG again to view it here.</p>`}</div>
    <div class="mf">${j.reqImg?`<button class="btn pri" data-tjview="${esc(j.id)}">View requirement sheet</button>`:""}${j.pack?`<button class="btn pri" data-tjview="${esc(j.id)}">View tagged drawing</button><button class="btn" data-tjpdf="${esc(j.id)}">Download PDF</button>`:""}<button class="btn haz" data-tjxl="${esc(j.id)}">Download part list (.xlsx)</button>${j.woId&&S.wos.find(w=>w.id===j.woId)?`<button class="btn" data-openwo="${esc(j.woId)}">Open work order</button>`:S.canWrite?`<button class="btn pri" data-tjwo="${esc(j.id)}">Create work order</button>`:""}</div>`);
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act^='tag-'],[data-tjx],[data-tjxl],[data-tjwo],[data-openwo],[data-tjview],[data-tjpdf]");if(!t)return;
  if(t.dataset.tjview){const j=S.tagjobs.find(x=>x.id===t.dataset.tjview);if(j?.reqImg)return viewReqImg(j);return viewStored(t.dataset.tjview)}
  if(t.dataset.tjpdf){const j=S.tagjobs.find(x=>x.id===t.dataset.tjpdf);return loadPack(j).then(sc=>sc&&drawingPdf(sc,j))}
  if(t.dataset.openwo){closeM();return setTimeout(()=>woDetail(t.dataset.openwo),0)}

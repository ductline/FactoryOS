  if(t.dataset.tjxl){const j=S.tagjobs.find(x=>x.id===t.dataset.tjxl);return tagXlsx(j.rows,{...j,woNo:(S.wos.find(w=>w.id===j.woId)||{}).woNo})}
  if(t.dataset.tjwo){const j=S.tagjobs.find(x=>x.id===t.dataset.tjwo);closeM();return tagWO(j.rows,j,j.id)}
  const a=t.dataset.act;
  if(a==="tag-reset"){(T.req?.urls||[]).forEach(u=>URL.revokeObjectURL(u));Object.assign(T,{file:null,res:null,rows:null,ents:null,buf:null,dxfText:null,jobId:null,woId:null,saved:null,error:null,scene:null,view:null,req:null,kind:null});T.job={client:"",name:"",floor:"",dlno:"1"};render.force=true;render()}
  if(a==="tag-xlsx"){tagXlsx(T.rows,{...T.job,file:T.file,woNo:(S.wos.find(w=>w.id===T.woId)||{}).woNo}).then(()=>saveTagJob())}
  if(a==="tag-zip")tagZip();
  if(a==="tag-pdf")drawingPdf(sceneOf(),{...T.job,file:T.file,...rowsTot()}).then(ok=>ok&&saveTagJob());
  if(a==="tag-wo")tagWO(T.rows,{...T.job,file:T.file});
});

/* ===== part-list Excel import (Ductline format: Duct No, type, Ext1, Ext2, Gauge, Connector, A-E, Final Length, Qty, Area sq ft, DL) ===== */
function itemFromSheetRow(r){
  const t=String(r.type||"");
  const type=/closing|dead\s*end/i.test(t)?"closing":/shoe/i.test(t)?"shoe":/elbow|bend/i.test(t)?"elbow":/taper|reducer|transition/i.test(t)?"taper":/offset/i.test(t)?"offset":/small/i.test(t)?"small":"straight";
  const ins=String(r.ins||"");const insCode=/^1[0-9]?\s*MM.*AC|^10\s*MM/i.test(ins)?"INS-ACO-10":/^9\s*MM/i.test(ins)?"INS-NBR-9":/^19\s*MM/i.test(ins)?"INS-NBR":"";
  const q=+r.qty||0;
  return {type,label:t,mark:String(r.mark??""),conn:r.conn||"",w:String(r.A||0),h:String(r.B||0),c:String(r.C||r.A||0),d:String(r.D||r.B||0),l:String(Math.round(+r.L||0)),qty:String(q),gauge:String(r.gauge||""),
    areaM2:+r.sqft>0&&q?String(+(r.sqft/10.7639/q).toFixed(5)):"",dl:r.dl??null,insCode,insName:insCode?ins:""};
}
async function parsePartList(buf){
  const ExcelJS=await loadScript("https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js","ExcelJS");
  const wb=new ExcelJS.Workbook();await wb.xlsx.load(buf);
  const val=c=>{const v=c&&c.value;if(v&&typeof v==="object"){if("result" in v)return v.result;if(v.richText)return v.richText.map(x=>x.text).join("");return null}return v};
  const n=v=>{const x=parseFloat(v);return isFinite(x)?x:null};
  const ws=wb.worksheets[0];let hdr=0,insCols=[];
  for(let i=1;i<=12&&!hdr;i++){const row=ws.getRow(i);const a=String(val(row.getCell(1))||"").trim().toLowerCase();if((a.startsWith("duct")||a.startsWith("s no"))&&val(row.getCell(13))!=null){hdr=i;
    for(let j=1;j<=40;j++){const h=String(val(row.getCell(j))||"").replace(/\n/g," ").trim().toUpperCase();if(/^\d+\s*MM/.test(h))insCols.push([j,h])}}}
  if(!hdr)throw new Error("This doesn't look like a Ductline part list (no Duct No / Qty header in the first sheet).");
  const rows=[];
  for(let i=hdr+1;i<=ws.rowCount;i++){const row=ws.getRow(i);const g=j=>val(row.getCell(j));
    if(g(2)==null||!n(g(13))||n(g(7))==null)continue;const t=String(g(2)).trim();if(/^(TOTAL|STAR AIR WELL)$/i.test(t))continue;
    let ins=null;for(const[j,h]of insCols)if(n(g(j))){ins=h;break}
    rows.push({mark:g(1),type:t,gauge:n(g(5))||24,conn:String(g(6)||"").trim(),A:n(g(7))||0,B:n(g(8))||0,C:n(g(9))||0,D:n(g(10))||0,E:n(g(11))||0,L:n(g(12))||0,qty:Math.round(n(g(13))),sqft:n(g(14))||0,dl:g(15),ins});}
  if(!rows.length)throw new Error("No duct rows found under the header.");
  return rows.map(itemFromSheetRow);
}
document.addEventListener("change",async e=>{
  const t=e.target;if(!t.dataset||!t.dataset.plimport||!t.files[0])return;
  const w=S.wos.find(x=>x.id===t.dataset.plimport);if(!w)return;
  try{toast("Reading part list…");const items=await parsePartList(await t.files[0].arrayBuffer());const r=calcWO(items,false);
    await S.db.doc("workorders/"+w.id).update({items,area:r.area,kg:r.kg,bom:r.bom,insulated:items.some(i=>i.insCode),partListFile:t.files[0].name,updatedAt:new Date().toISOString()});
    toast(`${items.reduce((s,i)=>s+(+i.qty||0),0)} pieces loaded from ${t.files[0].name}`);setTimeout(()=>woDetail(w.id),300);
  }catch(err){console.error(err);toast(err.message||"Couldn't read that file.")}
});

(async()=>{
  const LIVE="https://claude.ai/artifact/4pAvPiWHFGwUtcT8miYPR6";
  const offline=(h,m)=>{$("#main").innerHTML=`<div class="panel empty"><h3>${h}</h3><p>${m}</p><div class="bar" style="justify-content:center"><a class="btn pri" href="${LIVE}" target="_top" rel="noopener">Open Factory OS on claude.ai</a></div></div>`};
  if(typeof window.claude==="undefined"||!window.claude?.use){offline("This is a copy of Factory OS","The live app, with your stock, work orders and dispatches, runs on claude.ai. This copy has no database connected.");return}

  const db=await claude.use("db").finally(()=>clearTimeout(slow));

  const fail=e=>{console.error(e);$("#main").innerHTML=`<div class="panel empty"><h3>Lost connection to the factory database</h3><p>Reload the page to reconnect.</p></div>`};
  const resolveNames=async ids=>{if(!user)return;const need=[...new Set(ids.filter(i=>i&&!S.names[i]))];if(!need.length)return;try{const ps=await user.profiles(need);for(const i of need)S.names[i]=ps?.[i]?.name||"Someone"}catch(e){}};
  db.collection("materials").onSnapshot(s=>{S.materials={};s.docs.forEach(d=>{S.materials[d.id]={code:d.id,...d.data()}});S.loaded.m=1;render()},fail);
  db.collection("movements").onSnapshot(s=>{S.moves=s.docs.map(d=>({id:d.id,...d.data()}));S.loaded.v=1;resolveNames(S.moves.map(v=>v.by)).then(render);render()},fail);
  db.collection("workorders").onSnapshot(s=>{S.wos=s.docs.map(d=>({id:d.id,...d.data()}));S.loaded.w=1;resolveNames(S.wos.flatMap(w=>[...(w.stageLog||[]).map(l=>l.by),w.issuedBy])).then(render);render()},fail);
  db.collection("pos").onSnapshot(s=>{S.pos=s.docs.map(d=>({id:d.id,...d.data()}));S.loaded.p=1;render()},fail);
  db.collection("tagjobs").onSnapshot(s=>{S.tagjobs=s.docs.map(d=>({id:d.id,...d.data()}));render()},e=>console.error(e));
  db.collection("dispatches").onSnapshot(s=>{S.dispatches=s.docs.map(d=>({id:d.id,...d.data()}));render()},e=>console.error(e));
  db.collection("config").onSnapshot(s=>{const d=s.docs.find(x=>x.id==="zoho-sync");S.sync=d?d.data():null;const cp=s.docs.find(x=>x.id==="capacity");S.cap=cp?cp.data():null;if(S.tab==="dispatch"||S.tab==="floor"){render.force=true;render()}},e=>console.error(e));
})();
